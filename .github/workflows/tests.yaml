name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-suffix: tests
      - uses: actions/setup-python@v6.2.0
        with:
          python-version-file: .python-version
      - run: uv run python -m pytest tests/ --ignore=tests/integration -v
